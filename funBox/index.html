<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق المرح | FunBox 🎮</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .menu-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 20px 25px -5px rgba(56, 189, 248, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .description {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 10px;
        }

        /* زر العودة للرئيسية (اختياري هنا لأنها القائمة) */
        .home-footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #64748b;
        }

    </style>
</head>
<body>

    <h1>🎮 FunBox</h1>

    <div class="menu-container">
        <a href="squar.html" class="menu-card">
            <div class="icon">🔲</div>
            <div class="title">تحدي المربعات</div>
            <div class="description">اختبر معلوماتك</div>
        </a>

        <a href="number.html" class="menu-card">
            <div class="icon">⚡</div>
            <div class="title">تحدي التركيز</div>
            <div class="description">اجمع الأرقام السريعة بدقة</div>
        </a>

        <a href="photo.html" class="menu-card">
            <div class="icon">🧠</div>
            <div class="title">تحدي الذاكرة</div>
            <div class="description">كم كلمة تستطيع تذكرها؟</div>
        </a>
    </div>

    <div class="home-footer">
        بواسطة AI الذكي - استمتع باللعب مع أصدقائك
    </div>

</body>
</html>
